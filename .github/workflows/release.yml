name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test release version checks
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Check whether this version needs a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release_metadata.py

      - name: Set up Java 21
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Ensure Android SDK packages are installed
        if: steps.release.outputs.publish == 'true'
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'

      - name: Restore the existing app signing key
        if: steps.release.outputs.publish == 'true'
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ["ANDROID_SIGNING_KEYSTORE_BASE64"]
          if not encoded:
              raise SystemExit("Set the ANDROID_SIGNING_KEYSTORE_BASE64 repository secret before releasing")
          # Preserve the key used by v1.0.0; the Gradle release build uses this signing config.
          keystore = Path.home() / ".android" / "debug.keystore"
          keystore.parent.mkdir(parents=True, exist_ok=True)
          keystore.write_bytes(base64.b64decode(encoded, validate=True))
          keystore.chmod(0o600)
          PY

      - name: Test, lint, and build the release APK
        if: steps.release.outputs.publish == 'true'
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --console=plain

      - name: Verify and package the APK
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          SIGNING_CERT_SHA256: 9cc0155b9324854e716ce8df2913df37a3537972dec957e0de09726c8d4ee626
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("app/build/outputs/apk/release/output-metadata.json").read_text())
          assert metadata["applicationId"] == "com.visible.internationalminutes"
          assert len(metadata["elements"]) == 1
          apk = metadata["elements"][0]
          assert apk["versionName"] == os.environ["VERSION_NAME"]
          assert apk["versionCode"] == int(os.environ["VERSION_CODE"])
          assert apk["outputFile"] == "app-release.apk"
          PY
          apk=app/build/outputs/apk/release/app-release.apk
          certificate=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk")
          actual_digest=$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}' <<< "$certificate")
          if [[ "$actual_digest" != "$SIGNING_CERT_SHA256" ]]; then
            echo 'Signing certificate does not match the existing app; refusing to publish.' >&2
            exit 1
          fi
          mkdir -p dist
          asset="visible-plus-call-analytics-v${VERSION_NAME}.apk"
          cp "$apk" "dist/$asset"
          cd dist
          sha256sum "$asset" > "$asset.sha256"

      - name: Publish the APK and checksum
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ACTION: ${{ steps.release.outputs.action }}
        run: |
          if [[ "$RELEASE_ACTION" == 'create' ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft --title "Visible Minutes $RELEASE_TAG" \
              --generate-notes \
              --notes 'Download the APK below for Android 8.0 or later. Install it over the existing app to keep your settings. The SHA-256 file can be used to verify the download.'
          fi
          asset="visible-plus-call-analytics-${RELEASE_TAG}.apk"
          gh release upload "$RELEASE_TAG" "dist/$asset" "dist/$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Remove the signing key from the runner
        if: always() && steps.release.outputs.publish == 'true'
        run: rm -f "$HOME/.android/debug.keystore"
